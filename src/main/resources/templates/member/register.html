<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>
	.error {
		color: red;
		font-size: 0.7em;
		font-style: italic;
	}
</style>
</head>
<body>
	<h2>회원 가입 페이지</h2>
	<hr>
	<form th:object="${memberVO}" method="post">
	    <table border="1">
	        <tr>
	            <th>아이디</th>
	            <td>
	                <input type="text" th:field="*{id}" />
	                <span th:if="${#fields.hasErrors('id')}" th:errors="*{id}" class="error"></span>
	            </td>
	        </tr>
	        <tr>
	            <th>이름</th>
	            <td>
	                <input type="text" th:field="*{name}" />
	                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></span>
	            </td>
	        </tr>
	        <tr>
	            <th>비밀번호</th>
	            <td>
	                <input type="password" th:field="*{password}" />
	                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></span>
	            </td>
	        </tr>
	        <tr>
			    <th>이메일</th>
			    <td>
			        <input type="text" th:field="*{emailId}" placeholder="아이디" /> @
			        <input type="text" th:field="*{emailDomain}" placeholder="domain.com" />
			        <span th:if="${#fields.hasErrors('emailId')}" th:errors="*{emailId}" class="error"></span>
			        <span th:if="${#fields.hasErrors('emailDomain')}" th:errors="*{emailDomain}" class="error"></span>
			    </td>
			</tr>
	        <!-- 전화번호: 단일 입력창으로 입력받기 (예: 010-1234-5678) -->
	        <tr>
	            <th>전화번호</th>
	            <td>
	                <input type="text" th:field="*{tel}" placeholder="010-1234-5678" />
	                <span th:if="${#fields.hasErrors('tel')}" th:errors="*{tel}" class="error"></span>
	            </td>
	        </tr>
	        <tr>
	            <th>우편번호</th>
	            <td>
	                <input type="text" th:field="*{post}" maxlength="5" />
	                <span th:if="${#fields.hasErrors('post')}" th:errors="*{post}" class="error"></span>
	            </td>
	        </tr>
	        <tr>
	            <th>기본주소</th>
	            <td>
	                <input type="text" th:field="*{basicAddr}" />
	                <span th:if="${#fields.hasErrors('basicAddr')}" th:errors="*{basicAddr}" class="error"></span>
	            </td>
	        </tr>
	        <tr>
	            <th>상세주소</th>
	            <td>
	                <input type="text" th:field="*{detailAddr}" />
	                <span th:if="${#fields.hasErrors('detailAddr')}" th:errors="*{detailAddr}" class="error"></span>
	            </td>
	        </tr>
	    </table>
	    <br>
		<button>등록</button>
	</form>
	<p>
		<a th:href="@{/}">메인페이지로</a>
	</p>
</body>
</html>
